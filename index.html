<style>
:root{--bg:#fff;--fg:#1c1c1e;--muted:#6b6b70;--line:#e5e5ea;--accent:#0a64c8;--card:#f5f5f7}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:48px 20px 64px}
h1{font-size:2rem;margin:0 0 .25em}
p{margin:.5em 0 1em;color:var(--muted)}
a{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0}
.card h2{font-size:1.1rem;margin:0 0 .5em;color:var(--fg)}
.card ul{margin:0;padding-left:1.2em}
.card li{margin:.25em 0}
